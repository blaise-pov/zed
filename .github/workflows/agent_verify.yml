name: Agent Verify

# Fork-local verification pipeline dispatched by the `ci_verifier` agent.
# Mirrors upstream run_tests.yml recipes (clippy + nextest) on standard
# GitHub-hosted Windows runners. Linux/macOS jobs can be added later.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Check scope'
        required: false
        default: 'all'
        type: choice
        options: [all, clippy, tests]

permissions:
  contents: read

concurrency:
  group: agent-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'clippy' }}
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: agent-verify-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: agent-verify-${{ runner.os }}-
      - name: Setup cargo config
        run: |
          Copy-Item -Path "./.cargo/ci-config.toml" -Destination "./.cargo/config.toml" -Force
        shell: pwsh
      - name: Clippy
        run: ./script/clippy.ps1
        shell: pwsh
      - name: Cleanup cargo config
        if: always()
        run: Remove-Item -Recurse -Path "./../.cargo" -Force -ErrorAction SilentlyContinue
        shell: pwsh

  tests:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'tests' }}
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: agent-verify-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: agent-verify-${{ runner.os }}-
      - name: Setup cargo config
        run: |
          Copy-Item -Path "./.cargo/ci-config.toml" -Destination "./.cargo/config.toml" -Force
        shell: pwsh
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Install nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: nextest
      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast --no-tests=warn
        shell: pwsh
      - name: Cleanup cargo config
        if: always()
        run: Remove-Item -Recurse -Path "./../.cargo" -Force -ErrorAction SilentlyContinue
        shell: pwsh
